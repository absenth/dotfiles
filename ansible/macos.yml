---
- name: macOS Development Setup
  hosts: localhost
  connection: local
  become: false

  vars_prompt:
    - name: become_password
      prompt: "Enter sudo password"
      private: yes

  tasks:
    - name: Check if Homebrew is installed
      command: which brew
      register: brew_check
      changed_when: false
      failed_when: false

    - name: Install Homebrew
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: brew_check.rc != 0

    - name: Install Homebrew formulae
      community.general.homebrew:
        name:
          - bat
          - bob
          - bottom
          - eza
          - fd
          - fzf
          - gh
          - go
          - gopls
          - hyperfine
          - nmap
          - node
          - ripgrep
          - rust-analyzer
          - uv
          - zsh
        state: present
      when: brew_check.rc == 0

    - name: Install Homebrew casks (terminal)
      community.general.homebrew_cask:
        name: wezterm
        state: present
      when: brew_check.rc == 0
      ignore_errors: yes

    - name: Install Homebrew casks (browser)
      community.general.homebrew_cask:
        name: brave-browser
        state: present
      when: brew_check.rc == 0
      ignore_errors: yes

    - name: Install Homebrew casks (apps)
      community.general.homebrew_cask:
        name: raycast
        state: present
      when: brew_check.rc == 0
      ignore_errors: yes

    - name: Check current shell
      command: echo $SHELL
      register: current_shell
      changed_when: false
      failed_when: false

    - name: Set user shell to zsh
      become: true
      community.general.macports:
        name: zsh
        state: present
      when: current_shell.stdout != '/opt/homebrew/bin/zsh' and current_shell.stdout != '/usr/local/bin/zsh'
      ignore_errors: true

    - name: Add zsh to list of shells
      become: true
      lineinfile:
        path: /etc/shells
        line: /opt/homebrew/bin/zsh
        create: yes
      when: current_shell.stdout != '/opt/homebrew/bin/zsh' and current_shell.stdout != '/usr/local/bin/zsh'
      ignore_errors: true

    - name: Change user shell to zsh
      become: true
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /opt/homebrew/bin/zsh
      when: current_shell.stdout != '/opt/homebrew/bin/zsh' and current_shell.stdout != '/usr/local/bin/zsh'
      ignore_errors: true

    - name: Check if rustup is installed
      command: which rustup
      register: rustup_check
      changed_when: false
      failed_when: false

    - name: Install rustup
      shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      when: rustup_check.rc != 0

    - name: Check if Opencode is installed
      command: which opencode
      register: opencode_check
      changed_when: false
      failed_when: false

    - name: Install Opencode
      shell: curl -fsSL https://opencode.ai/install | bash
      when: opencode_check.rc != 0
      ignore_errors: yes
