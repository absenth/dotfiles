---
- name: Common Setup
  hosts: localhost
  connection: local
  become: false

  vars_prompt:
    - name: vault_password
      prompt: "Enter vault password to decrypt SSH keys"
      private: yes

  tasks:
    - name: Create ~/.bin directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/bin"
        state: directory
        mode: '0755'

    - name: Create ~/.tmp directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/tmp"
        state: directory
        mode: '0755'

    - name: Create ~/.src directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/src"
        state: directory
        mode: '0755'

    - name: Create ~/.ssh directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.ssh"
        state: directory
        mode: '0700'

    - name: Decrypt SSH private key
      ansible.builtin.shell: |
        echo '{{ vault_password }}' | ansible-vault decrypt {{ playbook_dir }}/../dot_ssh_private_key.vault --vault-password-file - --output {{ ansible_facts['user_dir'] }}/.ssh/id_ed25519
      args:
        creates: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519"
      changed_when: false

    - name: Set SSH private key permissions
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dot_ssh_public_key"
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
        mode: '0644'

    - name: Check if chezmoi is configured
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi/.git"
      register: chezmoi_git_dir

    - name: Configure chezmoi to use SSH
      when: chezmoi_git_dir.stat.exists
      block:
        - name: Check if chezmoi git remote is HTTPS
          ansible.builtin.command: git remote get-url origin
          args:
            chdir: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi"
          register: git_remote_url
          failed_when: false
          changed_when: false

        - name: Convert git remote to SSH
          when: git_remote_url.stdout is search('https://github.com')
          ansible.builtin.command: >
            git remote set-url origin 
            git@github.com:absenth/dotfiles.git
          args:
            chdir: "{{ ansible_facts['user_dir'] }}/.local/share/chezmoi"
