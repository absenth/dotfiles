---
- name: Linux Development Setup
  hosts: localhost
  connection: local
  become: true

  vars_prompt:
    - name: become_password
      prompt: "Enter sudo password"
      private: yes

  tasks:
    - name: Detect Linux distribution
      command: cat /etc/os-release
      register: os_release
      changed_when: false
      failed_when: false

    - name: Set distribution fact
      set_fact:
        distro_id: "{{ os_release.stdout | regex_search('^ID=.*', multiline=true) | regex_replace('^ID=', '') | trim }}"
        distro_id_like: "{{ os_release.stdout | regex_search('^ID_LIKE=.*', multiline=true) | regex_replace('^ID_LIKE=', '') | trim }}"

    - name: Install packages on Fedora/RHEL
      block:
        - name: Update dnf cache
          ansible.builtin.dnf:
            update_cache: yes
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']

        - name: Install packages (Fedora/RHEL)
          ansible.builtin.dnf:
            name:
              - zsh
              - fd-find
              - ripgrep
              - bat
              - golang
              - nodejs
              - npm
              - gh
              - nmap
              - fzf
              - git
              - curl
              - wget
              - neovim
              - htop
              - hyperfine
              - eza
              - gopls
              - rust-analyzer
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']

        - name: Enable wezterm COPR (Fedora)
          community.general.copr:
            name: wezfurlong/wezterm-nightly
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']
          ignore_errors: yes

        - name: Install wezterm (Fedora)
          ansible.builtin.dnf:
            name: wezterm
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']
          ignore_errors: yes
      when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma'] or 'rhel' in distro_id_like

    - name: Install packages on Debian/Ubuntu
      block:
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: yes
          when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop']

        - name: Install packages (Debian/Ubuntu)
          ansible.builtin.apt:
            name:
              - zsh
              - fd-find
              - ripgrep
              - bat
              - golang
              - nodejs
              - npm
              - gh
              - nmap
              - fzf
              - git
              - curl
              - wget
              - neovim
              - htop
              - hyperfine
              - bottom
              - eza
              - wezterm
              - rust-analyzer
            state: present
          when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop']
      when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop'] or 'debian' in distro_id_like or 'ubuntu' in distro_id_like

    - name: Install packages on Arch Linux
      block:
        - name: Install packages (Arch)
          ansible.builtin.pacman:
            name:
              - zsh
              - fd
              - ripgrep
              - bat
              - go
              - nodejs
              - npm
              - github-cli
              - nmap
              - fzf
              - git
              - curl
              - wget
              - neovim
              - htop
              - hyperfine
              - bottom
              - wezterm
              - eza
              - rust-analyzer
            state: present
          when: distro_id == 'arch'
      when: distro_id == 'arch' or 'arch' in distro_id_like

    - name: Install packages on Alpine Linux
      block:
        - name: Update apk cache
          community.general.apk:
            update_cache: yes
          when: distro_id == 'alpine'

        - name: Install packages (Alpine)
          community.general.apk:
            name:
              - zsh
              - fd
              - ripgrep
              - bat
              - go
              - nodejs
              - npm
              - gh
              - nmap
              - fzf
              - git
              - curl
              - wget
              - neovim
              - htop
              - hyperfine
              - bottom
              - eza
              - wezterm
              - gopls
              - rust-analyzer
            state: present
          when: distro_id == 'alpine'
      when: distro_id == 'alpine' or 'alpine' in distro_id_like

    - name: Check if rustup is installed
      command: which rustup
      register: rustup_check
      changed_when: false
      failed_when: false
      become: false

    - name: Install rustup
      shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      when: rustup_check.rc != 0
      become: false

    - name: Check if Opencode is installed
      command: which opencode
      register: opencode_check
      changed_when: false
      failed_when: false
      become: false

    - name: Install Opencode (x86_64)
      block:
        - name: Get Opencode latest version
          uri:
            url: https://api.github.com/repos/opencodeai/opencode/releases/latest
            return_content: yes
          register: opencode_release

        - name: Set opencode version fact
          set_fact:
            opencode_version: "{{ opencode_release.json.tag_name | regex_replace('^v', '') }}"
            opencode_arch: "linux-x64"

        - name: Download Opencode
          get_url:
            url: "https://github.com/opencodeai/opencode/releases/download/v{{ opencode_version }}/opencode-{{ opencode_version }}-{{ opencode_arch }}.tar.gz"
            dest: "/tmp/opencode-{{ opencode_version }}-{{ opencode_arch }}.tar.gz"

        - name: Extract Opencode
          unarchive:
            src: "/tmp/opencode-{{ opencode_version }}-{{ opencode_arch }}.tar.gz"
            dest: /tmp
            remote_src: yes

        - name: Move Opencode to /usr/local/bin
          command: mv /tmp/opencode /usr/local/bin/opencode

        - name: Clean up Opencode tarball
          file:
            path: "/tmp/opencode-{{ opencode_version }}-{{ opencode_arch }}.tar.gz"
            state: absent
      when: opencode_check.rc != 0
      ignore_errors: yes

    - name: Check current shell
      command: echo $SHELL
      register: current_shell
      changed_when: false
      failed_when: false

    - name: Add zsh to list of shells
      lineinfile:
        path: /etc/shells
        line: /usr/bin/zsh
        create: yes

    - name: Change user shell to zsh
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh
      when: current_shell.stdout != '/usr/bin/zsh'
