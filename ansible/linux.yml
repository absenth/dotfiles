---
- name: Linux Development Setup
  hosts: localhost
  connection: local

  vars_prompt:
    - name: become_password
      prompt: "Enter sudo password"
      private: yes

  tasks:
    - name: Detect Linux distribution
      command: cat /etc/os-release
      register: os_release
      changed_when: false
      failed_when: false

    - name: Set distribution fact
      set_fact:
        distro_id: "{{ os_release.stdout | regex_search('^ID=.*', multiline=true) | regex_replace('^ID=', '') | trim }}"
        distro_id_like: "{{ os_release.stdout | regex_search('^ID_LIKE=.*', multiline=true) | regex_replace('^ID_LIKE=', '') | trim }}"

    - name: Install packages on Fedora/RHEL
      become: true
      block:
        - name: Update dnf cache
          ansible.builtin.dnf:
            update_cache: yes
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']

        - name: Install packages (Fedora/RHEL)
          ansible.builtin.dnf:
            name:
              - bat
              - curl
              - fd-find
              - fzf
              - gh
              - git
              - golang
              - gopls
              - htop
              - hyperfine
              - neovim
              - nmap
              - nodejs
              - npm
              - ripgrep
              - rust-analyzer
              - wget
              - zsh
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']

        - name: Enable wezterm COPR (Fedora)
          community.general.copr:
            name: wezfurlong/wezterm-nightly
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']
          ignore_errors: yes

        - name: Install wezterm (Fedora)
          ansible.builtin.dnf:
            name: wezterm
            state: present
          when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma']
          ignore_errors: yes
      when: distro_id in ['fedora', 'rhel', 'centos', 'rocky', 'alma'] or 'rhel' in distro_id_like

    - name: Install packages on Debian/Ubuntu
      become: true
      block:
        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: yes
          when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop']

        - name: Install packages (Debian/Ubuntu)
          ansible.builtin.apt:
            name:
              - bat
              - curl
              - eza
              - fd-find
              - fzf
              - gh
              - git
              - golang
              - htop
              - hyperfine
              - neovim
              - nmap
              - nodejs
              - npm
              - ripgrep
              - unzip
              - wget
              - zsh
            state: present
          when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop']
      when: distro_id in ['debian', 'ubuntu', 'linuxmint', 'pop'] or 'debian' in distro_id_like or 'ubuntu' in distro_id_like

    - name: Install packages on Arch Linux
      become: true
      block:
        - name: Install packages (Arch)
          ansible.builtin.pacman:
            name:
              - bat
              - bottom
              - curl
              - eza
              - fd
              - fzf
              - git
              - github-cli
              - go
              - htop
              - hyperfine
              - neovim
              - nmap
              - nodejs
              - npm
              - ripgrep
              - rust-analyzer
              - wezterm
              - wget
              - zsh
            state: present
          when: distro_id == 'arch'
      when: distro_id == 'arch' or 'arch' in distro_id_like

    - name: Install packages on Alpine Linux
      become: true
      block:
        - name: Update apk cache
          community.general.apk:
            update_cache: yes
          when: distro_id == 'alpine'

        - name: Install packages (Alpine)
          community.general.apk:
            name:
              - bat
              - bottom
              - curl
              - eza
              - fd
              - fzf
              - gh
              - git
              - go
              - gopls
              - htop
              - hyperfine
              - neovim
              - nmap
              - nodejs
              - npm
              - ripgrep
              - rust-analyzer
              - wezterm
              - wget
              - zsh
            state: present
          when: distro_id == 'alpine'
      when: distro_id == 'alpine' or 'alpine' in distro_id_like

    - name: Check if rustup is installed
      command: which rustup
      register: rustup_check
      changed_when: false
      failed_when: false
      become: false

    - name: Install rustup
      shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      when: rustup_check.rc != 0
      become: false

    - name: Check if Opencode is installed
      command: which opencode
      register: opencode_check
      changed_when: false
      failed_when: false
      become: false

    - name: Install Opencode
      shell: curl -fsSL https://opencode.ai/install | bash
      when: opencode_check.rc != 0
      become: false
      ignore_errors: yes

    - name: Check if bob is installed
      command: which bob
      register: bob_check
      changed_when: false
      failed_when: false
      become: false

    - name: Install bob
      shell: curl -fsSL https://raw.githubusercontent.com/MordechaiHadad/bob/master/scripts/install.sh | bash
      when: bob_check.rc != 0
      become: false
      ignore_errors: true

    - name: Install bob nightly
      shell: bob install nightly
      become: false
      ignore_errors: true

    - name: Install bob stable
      shell: bob install stable
      become: false
      ignore_errors: true

    - name: Use bob stable
      shell: bob use stable
      become: false
      ignore_errors: true

    - name: Check current shell
      command: echo $SHELL
      register: current_shell
      changed_when: false
      failed_when: false

    - name: Add zsh to list of shells
      lineinfile:
        path: /etc/shells
        line: /usr/bin/zsh
        create: yes

    - name: Change user shell to zsh
      become: true
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /usr/bin/zsh
      when: current_shell.stdout != '/usr/bin/zsh'
      ignore_errors: true
